name: Release

# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# runs the test suite on all three platforms, builds the Windows and macOS
# apps, and publishes them as a GitHub release. A workflow_dispatch run does
# everything except publish, leaving the zips as workflow artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build-windows:
    name: Build Windows app
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build FileConverter.exe
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -r requirements.txt pyinstaller
          .\build_app.ps1

      - name: Zip the app
        run: Compress-Archive -Path dist\FileConverter -DestinationPath FileConverter-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileConverter-windows
          path: FileConverter-windows.zip

  build-macos:
    name: Build macOS app (Apple Silicon)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build File Converter.app
        run: ./build_app.sh

      # ditto preserves the symlinks and permissions inside the .app bundle;
      # a plain zip step would break it.
      - name: Zip the app
        run: ditto -c -k --keepParent "dist/File Converter.app" FileConverter-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileConverter-macos
          path: FileConverter-macos.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FileConverter-windows.zip
            FileConverter-macos.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Standalone apps — no Python required. Download, unzip, run.

            | Platform | File | First launch |
            | -------- | ---- | ------------ |
            | Windows | `FileConverter-windows.zip` | If SmartScreen appears: **More info → Run anyway** |
            | macOS (Apple Silicon) | `FileConverter-macos.zip` | Right-click the app → **Open** → **Open** |

            The apps are unsigned, which is why the one-time warnings appear.
            Intel Mac? Build from source instead — see the
            [README](https://github.com/${{ github.repository }}#macos-app).
